<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | INVENTEC</title>
    <link rel="stylesheet" href="estilos.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #2563eb);
        }

        .register-card {
            max-width: 600px;
        }

        .register-brand {
            margin-bottom: 25px;
            text-align: center;
        }

        .register-brand img {
            width: 150px;
            height: 100px;
            object-fit: contain;
        }

        .register-brand h1 {
            color: var(--dark);
            font-size: 28px;
        }

        .register-brand p {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .register-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 18px;
        }

        .register-form .full-width {
            grid-column: 1 / -1;
        }

        .register-form .main-button {
            grid-column: 1 / -1;
            margin-top: 10px;
        }

        .form-footer {
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        @media (max-width: 600px) {
            .register-card {
                padding: 25px 20px;
            }

            .register-form {
                display: block;
            }
        }
    </style>
</head>

<body>
    <main class="form-container register-card">
        <header class="register-brand">
            <img
                src="imagen_logo_empresa_inventario-removebg-preview.png"
                alt="Logo de INVENTEC"
            >

            <h1>Crear cuenta</h1>
            <p>Regístrate para administrar el inventario</p>
        </header>

        <form
            class="register-form"
            action="RegistroServlet"
            method="POST"
            id="registerForm"
        >
            <div class="field-group">
                <label for="nombres">Nombres</label>
                <input
                    type="text"
                    id="nombres"
                    name="nombres"
                    placeholder="Pedro José"
                    autocomplete="given-name"
                    required
                >
            </div>

            <div class="field-group">
                <label for="apellidos">Apellidos</label>
                <input
                    type="text"
                    id="apellidos"
                    name="apellidos"
                    placeholder="Pérez Gómez"
                    autocomplete="family-name"
                    required
                >
            </div>

            <div class="field-group">
                <label for="cedula">Cédula / identificación</label>
                <input
                    type="text"
                    id="cedula"
                    name="cedula"
                    placeholder="12345678"
                    inputmode="numeric"
                    pattern="[0-9]+"
                    title="Ingresa únicamente números"
                    required
                >
            </div>

            <div class="field-group">
                <label for="usuario">Usuario</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="pedro.admin"
                    autocomplete="username"
                    minlength="4"
                    required
                >
            </div>

            <div class="field-group">
                <label for="fecha_nacimiento">Fecha de nacimiento</label>
                <input
                    type="date"
                    id="fecha_nacimiento"
                    name="fecha_nacimiento"
                    autocomplete="bday"
                    required
                >
            </div>

            <div class="field-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 6 caracteres"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="main-button">
                Crear cuenta
            </button>
        </form>

        <footer class="form-footer">
            <p>
                ¿Ya tienes una cuenta?
                <a href="login.html">Iniciar sesión</a>
            </p>
        </footer>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const birthDate = document.getElementById("fecha_nacimiento");

        birthDate.max = new Date().toISOString().split("T")[0];

        form.addEventListener("submit", function (event) {
            const date = new Date(birthDate.value);
            const today = new Date();

            let age = today.getFullYear() - date.getFullYear();
            const monthDifference = today.getMonth() - date.getMonth();

            if (
                monthDifference < 0 ||
                (monthDifference === 0 && today.getDate() < date.getDate())
            ) {
                age--;
            }

            if (date > today) {
                event.preventDefault();
                alert("La fecha de nacimiento no puede ser futura.");
                return;
            }

            if (age < 18) {
                event.preventDefault();
                alert("Debes tener al menos 18 años para registrarte.");
            }
        });
    </script>
</body>
</html>
