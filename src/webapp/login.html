<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | INVENTEC</title>
    <link rel="stylesheet" href="estilos.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #2563eb);
        }

        .login-card {
            overflow: hidden;
            padding: 0;
        }

        .login-header {
            padding: 35px 30px;
            background: #0f172a;
            text-align: center;
            color: white;
        }

        .login-header img {
            width: 130px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .login-header h1 {
            font-size: 25px;
            margin-bottom: 6px;
        }

        .login-header p {
            color: #cbd5e1;
            font-size: 14px;
        }

        .login-form {
            padding: 30px;
        }

        .login-form .main-button {
            margin-top: 12px;
        }

        .password-help {
            display: block;
            margin-top: 12px;
            color: #2563eb;
            text-align: right;
            font-size: 13px;
        }

        .register-text {
            margin-top: 24px;
            color: #64748b;
            text-align: center;
            font-size: 14px;
        }

        .register-text a {
            color: #2563eb;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main class="form-container login-card">
        <section class="login-header">
            <img
                src="imagen_logo_empresa_inventario-removebg-preview.png"
                alt="Logo de INVENTEC"
            >

            <h1>Bienvenido a INVENTEC</h1>
            <p>Controla tu inventario de forma sencilla</p>
        </section>

        <form class="login-form" action="dashboard.html" method="get">
            <div class="field-group">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ingresa tu usuario"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required
                >
            </div>

            <a href="#" class="password-help">¿Olvidaste tu contraseña?</a>

            <button type="submit" class="main-button">
                Ingresar al sistema
            </button>

            <p class="register-text">
                ¿No tienes una cuenta?
                <a href="registro.html">Crear cuenta</a>
            </p>
        </form>
    </main>
</body>
</html>
